plugins {
    id 'java-library'
    id 'maven-publish'
    id "checkstyle"
}

if (System.getenv("SNAPSHOT") != null) {
    String buildNumber = System.getenv("BUILD_NUMBER")

    if (buildNumber != null) {
        version += "-$buildNumber"
    }
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    // Compiled by a newer JDK (so it can read the Java 21 class files of the 1.21.1 stand-in dependencies),
    // targeting the Java version that Minecraft 1.20.1 runs on.
    toolchain.languageVersion = JavaLanguageVersion.of(java_toolchain_version)
    // Allow resolving the Java 21 stand-in jars; the release flag below still pins our bytecode to Java 17.
    disableAutoTargetJvm()
    withSourcesJar()
//    withJavadocJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Forge'
                url = 'https://maven.minecraftforge.net'
            }
        }
        filter { includeGroupAndSubgroups('net.minecraftforge') }
    }
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    maven { url = "https://maven.ithundxr.dev/mirror" } // Registrate
    maven { url = "https://maven.ithundxr.dev/hidden" } // Registrate
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://maven.createmod.net" } // Ponder

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }

    maven { url = "https://maven.tterrag.com" } // Flywheel

    maven {
        url = "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }

    maven {
        name = "Mortuusars Github Maven"
        url = "https://raw.githubusercontent.com/mortuusars/resources/main/maven/"
    }
    maven {
        url = "https://maven.ryanhcode.dev/releases"
    }

}

// Optional compat targets whose code lives in common. These are Forge 1.20.1 mod jars, so they go through
// ModDevGradle's remapping configurations (SRG -> Mojang names).
pluginManager.withPlugin('net.neoforged.moddev.legacyforge') {
    dependencies {
        modCompileOnly "maven.modrinth:embeddium:$embeddium_version"
        modCompileOnly("maven.modrinth:oculus:$oculus_version") { transitive = false }
        modCompileOnly "maven.modrinth:distanthorizons:$distant_horizons_version"
        modCompileOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge:$cc_tweaked_version") { transitive = false }
        modCompileOnly("maven.modrinth:exposure:$exposure_version") { transitive = false }
        modCompileOnly("maven.modrinth:jade:${project.jade_version}+forge") { transitive = false }
        modCompileOnly("maven.modrinth:jade-addons-forge:${project.jade_addons_version}+forge") { transitive = false }
        modCompileOnly("maven.modrinth:moonlight:${project.moonlight_version}-forge") { transitive = false }
        modCompileOnly("maven.modrinth:shoulder-surfing-reloaded:${minecraft_version}-${project.shouldersurfing_version}+forge") { transitive = false }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.compilerArgs.addAll(['-Xmaxerrs', '100000'])
}


sourcesJar {
    from(rootProject.file('LICENSE.md')) {
        rename { "${it}" }
    }
}

jar {
    from(rootProject.file('LICENSE.md')) {
        rename { "${it}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

String createModVersionRange() {
    def createForgeVersion = create_version.split("-")[0]
    def parts = createForgeVersion.split("\\.").collect {it.toInteger() }
    def newMinor = parts[1] + 1
    def upperBounds = "${parts[0]}.$newMinor.0"

    return "[$createForgeVersion,$upperBounds)"
}

processResources {
    var expandProps = [
            'version'                      : rootProject.version, // Make sure snapshots aren't included
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'create_version_range'         : createModVersionRange(),
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'issues'                       : issues,
            'description'                  : project.description,
            'forge_version'                : forge_version,
            'forge_version_range'          : forge_version_range,
            'forge_loader_version_range'   : forge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'veil_version'                 : veil_version,
            'embeddium_version'            : embeddium_version,
            'sable_companion_version'      : sable_companion_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}


checkstyleMain {
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    configProperties = [ 'checkstyle.cache.file': "${buildDir}/checkstyle.cache" ]
    ignoreFailures = true
    showViolations = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }

    repositories {
        mavenLocal()
        maven {
            url = System.getenv('MAVEN_PUBLISH_URL')

            credentials {
                username = System.getenv('local_maven_user')
                password = System.getenv('local_maven_token')
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}