plugins {
    id 'me.modmuss50.mod-publish-plugin'
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    // Automatically enable AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty("forge.enabledGameTestNamespaces", mod_id.toString())
            programArgument("-mixin.config=sable.mixins.json")
            programArgument("-mixin.config=sable-neoforge.mixins.json")
            ideName = "Forge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = project.file("runs/client")
            // Run with -PquickPlay=<world> to load straight into a singleplayer world
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
        }
        server {
            server()
            gameDirectory = project.file("runs/server")
        }
        gameTest {
            type = "gameTestServer"
            gameDirectory = project.file("build/gametest")
        }

        clientMixinExport {
            client()
            ideName = "Forge Client | Mixin Export (${project.path})"
            systemProperty("mixin.debug.export", "true")
            gameDirectory = project.file("runs/client")
        }
        serverMixinExport {
            server()
            ideName = "Forge Server | Mixin Export (${project.path})"
            systemProperty("mixin.debug.export", "true")
            gameDirectory = project.file("runs/server")
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Forge 1.20.1 runs on SRG names, so every mixin config needs a refmap. The common sources are compiled in this
// project, so one refmap covers both configs.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}-neoforge.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}") {
        version {
            strictly "[${mixinextras_version},)"
            prefer mixinextras_version
        }
    }

    // Nested jars must use SRG names in production, so bundle the reobfuscated builds of Sable's own libraries
    implementation project(':sable_companion')
    jarJar(project(':sable_companion'))

    modCompileOnly "maven.modrinth:distanthorizons:$rootProject.distant_horizons_version"

    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    // Sable mixes into Flywheel's backend, so compile against the full jar
    modImplementation("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")

    modCompileOnly("maven.modrinth:sodium-extras:$sodiumextras_version") { transitive = false }

    modImplementation("foundry.veil:veil-forge-${project.minecraft_version}:${project.veil_version}") {
        exclude group: "maven.modrinth"
        exclude group: "me.fallenbreath"
    }
    jarJar("foundry.veil:veil-forge-${project.minecraft_version}:${project.veil_version}") {
        transitive = false
    }
    // Bundled inside the Veil jar, but not declared in its published metadata
    compileOnly "io.github.ocelot:glsl-processor:0.2.3"
    compileOnly "gg.moonflower:molang-compiler:3.1.1.19"
    // Veil's ImGui editor API (the ImGuiMC runtime is optional)
    compileOnly "io.github.spair:imgui-java-binding:1.92.0"

    runtimeOnly project(path: ":sable_rapier", configuration: "runtimeElements")
    jarJar(project(":sable_rapier"))
    // Used by sable_rapier to unpack its natives; Minecraft 1.21 ships it but 1.20.1 doesn't
    additionalRuntimeClasspath "org.lz4:lz4-java:1.8.0"
    jarJar("org.lz4:lz4-java:1.8.0") {
        version {
            strictly "[1.8.0,2.0)"
            prefer "1.8.0"
        }
    }
}

// Static mixin audit against the real 1.20.1 target classes (scripts/mixin-check/MixinChecker.java):
// ./gradlew :forge:checkMixins
sourceSets {
    mixinCheck {
        java.srcDir rootProject.file('scripts/mixin-check')
    }
}

dependencies {
    mixinCheckImplementation 'org.ow2.asm:asm-tree:9.7'
    mixinCheckImplementation 'com.google.code.gson:gson:2.10'
}

tasks.register('checkMixins', JavaExec) {
    group = 'verification'
    description = 'Checks every mixin target, injector signature and @At target against the classes on the compile classpath'
    dependsOn 'classes', 'mixinCheckClasses'
    classpath = sourceSets.mixinCheck.runtimeClasspath + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'MixinChecker'
    args = ["${mod_id}.mixins.json", "${mod_id}-neoforge.mixins.json"].collect { layout.buildDirectory.file("resources/main/$it").get().asFile.path }
}

// Forge 1.20.1 only loads mixin configs listed in the jar manifest
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json,${mod_id}-neoforge.mixins.json")
}

// The same audit against what production loads (see MixinChecker): the reobfuscated jar and its refmap, checked
// against SRG-named Minecraft and the original (SRG) mod jars. Needs a Forge client install for the SRG Minecraft jars:
//   java -jar forge-1.20.1-<forge_version>-installer.jar --installClient <dir>   (an empty launcher_profiles.json is enough)
//   ./gradlew :forge:checkMixinsProduction -PforgeClientInstall=<dir>
tasks.register('checkMixinsProduction', JavaExec) {
    group = 'verification'
    description = 'Checks the reobfuscated mixins and refmap against SRG-named Minecraft and mod jars'
    dependsOn 'reobfJar', 'mixinCheckClasses'
    def jarFile = tasks.named('reobfJar').flatMap { it.archiveFile }
    def devClasspath = sourceSets.main.compileClasspath
    def refmapFile = layout.buildDirectory.file("tmp/checkMixinsProduction/${mod_id}.refmap.json")
    mainClass = 'MixinChecker'
    doFirst {
        if (!project.hasProperty('forgeClientInstall')) {
            throw new GradleException('Pass -PforgeClientInstall=<dir of a Forge client install>')
        }
        def install = file(project.property('forgeClientInstall'))
        def libraries = new File(install, 'libraries')
        def srgMinecraft = [
                "net/minecraftforge/forge/${minecraft_version}-${forge_version}/forge-${minecraft_version}-${forge_version}-client.jar",
                "net/minecraftforge/forge/${minecraft_version}-${forge_version}/forge-${minecraft_version}-${forge_version}-universal.jar",
        ].collect { new File(libraries, it) }
        srgMinecraft += fileTree(new File(libraries, 'net/minecraft/client')).matching { include '**/*-srg.jar' }.files
        srgMinecraft.each { if (!it.exists()) throw new GradleException("Missing $it") }

        // ModDevGradle only puts dev-remapped copies of mods on the classpath; use the originals from the Gradle cache
        def modulesCache = new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1')
        def originals = [:]
        def libs = []
        devClasspath.files.each { f ->
            if (f.path.contains('/transforms/')) {
                originals[f.name] = null
            } else if (!f.path.contains('/moddev/') && !f.path.startsWith(rootDir.path)) {
                libs << f
            }
        }
        def mavenLocalDir = new File(System.getProperty('user.home'), '.m2/repository')
        [modulesCache, mavenLocalDir].findAll { it.exists() }.each { dir ->
            fileTree(dir).matching { originals.keySet().each { name -> include "**/$name" } }.files.each { originals[it.name] = it }
        }
        originals.each { name, f -> if (f == null) throw new GradleException("No original jar for $name in $modulesCache or $mavenLocalDir") }

        def refmap = refmapFile.get().asFile
        refmap.parentFile.mkdirs()
        refmap.bytes = zipTree(jarFile.get().asFile).matching { include "${mod_id}.refmap.json" }.singleFile.bytes

        classpath = files(sourceSets.mixinCheck.runtimeClasspath.files.findAll { !it.path.contains('/moddev/') && !it.path.contains('/transforms/') && !it.path.startsWith(rootDir.path) || it.path.contains('mixinCheck') },
                jarFile, srgMinecraft, originals.values(), libs)
        args = ['--refmap', refmap.path] + ["${mod_id}.mixins.json", "${mod_id}-neoforge.mixins.json"].collect { layout.buildDirectory.file("resources/main/$it").get().asFile.path }
    }
}
