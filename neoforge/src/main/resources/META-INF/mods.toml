modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
issueTrackerURL = "${issues}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
credits = "${credits}"
description = '''${description}'''
logoFile = "icon.png"
logoBlur = false

["lithium:options"]
"mixin.entity.collisions.unpushable_cramming" = false
"mixin.world.chunk_access" = false
"mixin.world.chunk_ticking" = false
"mixin.world.tick_scheduler" = false

# Mixin configs are declared through the jar manifest (MixinConfigs) on Forge 1.20.1.

[[dependencies.sable]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.sable]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.sable]]
modId = "flywheel"
mandatory = false
versionRange = "[1.0.5,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.sable]]
modId = "create"
mandatory = false
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "CLIENT"

# Forge 1.20.1 has no "incompatible" dependency type, so the NeoForge build's guards against a newer sable-companion,
# old Sodium versions and ScalableLux are not expressible here.
