plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    // Vanilla 1.20.1 through MCP; common code must not reference Forge.
    mcpVersion = mcp_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'/*, 'javadocElements'*/].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

dependencies {
    compileOnly "org.spongepowered:mixin:$mixin_version"

    // mixinextras is bundled by the loader module, so it is safe to use it in common
    compileOnly "io.github.llamalad7:mixinextras-common:$mixinextras_version"
    annotationProcessor "io.github.llamalad7:mixinextras-common:$mixinextras_version"

    implementation "org.apache.maven:maven-artifact:3.8.5"

    api(project(':sable_companion'))

    // See gradle.properties: the 1.21.1 build of Veil is a compile-only stand-in until Veil 4.x is ported.
    compileOnly("foundry.veil:veil-common-${project.veil_minecraft_version}:${project.veil_version}") {
        transitive = false
    }
    compileOnly "io.github.ocelot:glsl-processor:0.2.3"
    compileOnly "gg.moonflower:molang-compiler:3.1.1.19"
    compileOnly "io.github.spair:imgui-java-binding:1.92.0"
    compileOnly "org.ow2.asm:asm-tree:9.5"

    // ForgeConfigSpec for common code (Forge provides it at runtime)
    compileOnly("fuzs.forgeconfigapiport:forgeconfigapiport-common:${forgeconfigapiport_version}") {
        transitive = false
    }
    compileOnly "com.electronwill.night-config:core:3.6.4"
    compileOnly "com.electronwill.night-config:toml:3.6.4"
}
