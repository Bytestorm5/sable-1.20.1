mixin_version=0.8.5
mixinextras_version=0.5.3

# Dependencies
sable_companion_version=1.6.0
# sable-companion is only published for 1.21.1; the sable_companion project rebuilds it for 1.20.1 from its sources.
forgeconfigapiport_version=8.0.3
# Veil 4.x has no 1.20.1 build yet (see the Veil port). Until it exists, the 1.21.1 jar is used as a compile-only
